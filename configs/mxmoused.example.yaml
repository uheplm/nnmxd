# mxmoused configuration.
#
# Copy to /etc/mxmoused/config.yaml (system) or ~/.config/mxmoused/config.yaml
# (user) or pass via --config <path>.

# Which mode to run.
#   gesture      — hold thumb button + drag/scroll to switch columns/workspaces
#   meta-toggle  — tap thumb button to virtually hold the Super key
mode: gesture

device:
  # Auto-detect the MX Master 3 / 3S across USB receiver and Bluetooth.
  # Matches by Logitech vendor id (0x046d) + presence of trigger_button.
  auto_detect: true
  # Explicit device path. If set, overrides auto-detection.
  # path: /dev/input/event15
  # Which mouse button activates the mode. For MX Master 3 / 3S, the thumb
  # gesture button is BTN_FORWARD.
  trigger_button: BTN_FORWARD

gesture:
  # Pixels of movement to trigger the first gesture step.
  threshold: 100
  # Additional pixels required for each subsequent step inside one hold.
  # Step thresholds: threshold, threshold+escalation, threshold+2*escalation, ...
  escalation: 250
  bindings:
    # Each binding is an action name. Names without a prefix are fired as
    # "niri msg action <name>". Names prefixed with "logid:" are dispatched
    # to the logid daemon over D-Bus (soft dependency — silently ignored
    # with a warning if logid is not running).
    #
    # Supported logid: actions (require logid with matching device in
    # logid.cfg):
    #   logid:cycle-profile           — rotate to next profile in order
    #   logid:set-profile:<name>      — switch to named profile
    #
    # Example with logid: bindings
    #   left:  logid:set-profile:Browser
    #   right: logid:set-profile:Code
    #   tap:   logid:cycle-profile
    left:        focus-column-left
    right:       focus-column-right
    up:          focus-workspace-up
    down:        focus-workspace-down
    # Fired on a short tap (hold + release with no drag).
    tap:         toggle-overview
    # Fired on scroll wheel up/down while the trigger button is held.
    scroll_up:   focus-workspace-up
    scroll_down: focus-workspace-down

meta_toggle:
  # Virtual key to inject when toggled on. KEY_LEFTMETA = Super.
  key: KEY_LEFTMETA
  # Path to write Waybar-compatible JSON state (custom module consumes this).
  state_file: /tmp/mxmoused-state
  # Write the state file. Disable if no Waybar module is configured.
  waybar: true

logid:
  # Device name as it appears in logid.cfg (the "name:" field inside the
  # matching device block). Leave empty to auto-try "MX Master 3S" then
  # "MX Master 3" — works for most setups.
  device_name: ""
